version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/agritrace
      - JWT_SECRET=your_jwt_secret
      # Add other env vars as needed
    depends_on:
      - mongo
    networks:
      - agritrace-network

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    networks:
      - agritrace-network

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - agritrace-network

volumes:
  mongo-data:

networks:
  agritrace-network:
    driver: bridge